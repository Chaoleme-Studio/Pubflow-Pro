[workspace]
members = ["app", "entity", "migration", "dev-tools", "core", "native", "wasm"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["{{author_name}}"]
license = "MIT"
repository = "https://github.com/{{authors}}/{{project-name}}"

[workspace.dependencies]
pubflow-core = { path = "core" }
sea-orm = { version = "1.1.19", features = [
    "macros",
    "debug-print",
    "with-chrono",
    "with-uuid",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-sqlite",
    "with-json",
    "with-time",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
anyhow = "1.0.98"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3.19"
strum = { version = "0.27.2", features = ["derive"] }
num_enum = "0.7.5"
schemars = { version = "0.9.0", features = ["derive", "chrono04", "uuid1"] }
sonyflake = "0.4.0"
harsh = "0.2.2"
sqids = "0.4.2"
validator = { version = "0.20.0", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["serde"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
getrandom = { version = "0.2.16", features = ["js"] }
sha2 = "0.10.9"
hkdf = "0.12.4"
hex = "0.4.3"
base64 = "0.22.1"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
js-sys = "0.3.82"
web-sys = "0.3.82"
curve25519-dalek = "4.1.3"
subtle = "2.6.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
