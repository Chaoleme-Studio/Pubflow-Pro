<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PubFlow 管理员登录解锁</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 24px;
      line-height: 1.6;
      color: #333;
    }
    h1 { font-size: 20px; margin-bottom: 16px; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      color: #fff;
      background: #1677ff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #4096ff; }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
    .ok { color: #52c41a; }
    .warn { color: #fa8c16; }
  </style>
</head>
<body>
  <h1>PubFlow 管理员登录解锁</h1>
  <p>点击下面按钮，清除当前浏览器中 PubFlow 管理后台的登录失败锁定记录。</p>
  <button id="unlock">立即解锁</button>
  <pre id="output">等待操作...</pre>

  <script>
    const output = document.getElementById('output');
    const keys = ['pubflow_admin_login_attempts', 'pubflow_admin_locked_until'];

    function readState() {
      const lines = keys.map(k => {
        const v = localStorage.getItem(k);
        return `${k}: ${v === null ? '(未设置)' : v}`;
      });
      output.textContent = '当前记录：\n' + lines.join('\n');
    }

    document.getElementById('unlock').addEventListener('click', () => {
      try {
        for (const key of keys) {
          localStorage.removeItem(key);
        }
        output.innerHTML = '<span class="ok">✅ 已清除锁定记录</span>\n\n现在请刷新 PubFlow 管理后台页面（/admin），重新输入账号密码登录。';
      } catch (err) {
        output.innerHTML = '<span class="warn">❌ 清除失败：' + (err?.message || String(err)) + '</span>';
      }
    });

    readState();
  </script>
</body>
</html>
