name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pubflow-Pro/pnpm-lock.yaml

      - name: Install & Build Extension
        working-directory: pubflow-Pro
        run: |
          pnpm install --frozen-lockfile
          pnpm build:protected
          pnpm verify:release

      - name: Pack ZIP
        run: |
          cp CHANGELOG.md pubflow-Pro/.output/chrome-mv3/CHANGELOG.md
          cd pubflow-Pro/.output/chrome-mv3
          zip -r ../../../pubflow-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: pubflow-extension.zip

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pubflow-Pro-Web/pnpm-lock.yaml

      - name: Install & Build Web
        working-directory: pubflow-Pro-Web
        run: |
          pnpm install
          pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: pubflow-Pro-Web/dist/

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: pubflow-Pro-server-axum-starter
        run: ./scripts/build-wasm.sh --out-dir ../dist/wasm

      - name: Build server native helper (Linux)
        working-directory: pubflow-Pro-server-axum-starter
        run: ./scripts/build-native.sh --out-dir ../dist/native

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/

  build-native:
    name: Native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - platform: mac-x64
            runner: macos-14
            target: x86_64-apple-darwin
          - platform: win-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pubflow-Pro-Web/pnpm-lock.yaml
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pubflow-Pro-Native
          key: ${{ matrix.target }}
      - name: Prepare production build environment
        shell: bash
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: printf 'PUBLIC_API_BASE_URL=%s\n' "$PUBLIC_API_BASE_URL" > .env.production
      - name: Build Native package
        shell: bash
        run: ENV=production ./scripts/build-native.sh --target "${{ matrix.target }}" --out-dir dist/native
      - name: Upload Native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/pubflow-pro-native-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: [build-extension, build-web, build-server, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/release-assets/pubflow-extension.zip
            dist/release-assets/pubflow-pro-native-*
