# PubFlow Pro Nginx 配置
# ==============================================================================
# 当前端口约定：
#   网页端 / 官网入口：http://117.72.147.216:5188
#   服务端 / API：     http://117.72.147.216:5189
#
# 当前部署脚本约定：
#   网页端目录：/home/wong/Desktop/Application/PubFlow/web
#   服务端进程：127.0.0.1:5189
#
# 使用方式：
#   复制本文件到服务器 /etc/nginx/conf.d/pubflow.conf
#   然后执行：nginx -t && systemctl reload nginx
# ==============================================================================

server {
    listen 5188;
    server_name _;

    root /home/wong/Desktop/Application/PubFlow/web;
    index index.html;
    charset utf-8;
    client_max_body_size 100m;
    error_page 404 /404/index.html;

    # 网页端静态文件由 5188 提供。
    # 如果网页端请求同源 /v1/...，这里转发到本机后端 5189。
    # 插件使用 .env.production 中的 PUBLIC_API_BASE_URL 直接访问 5189。
    # 网页端始终请求同源 /v1，由这段代理转发，以兼容以后的 HTTPS 域名。
    location = /v1/remote/extension/ws {
        proxy_pass http://127.0.0.1:5189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:5189;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5189/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:5189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 首页是唯一允许搜索引擎收录的页面。
    location = / {
        try_files /index.html =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    location = /icon.svg {
        try_files $uri =404;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 付款、下载、卡密、后台和 404 页都不参与收录。
    # SSG 会为现有业务路由生成对应目录，未知路由返回真实 404。
    location / {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ =404;
    }
}
