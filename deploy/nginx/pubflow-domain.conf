# PubFlow public domain entry point.
#
# 80 端口只做两件事：ACME 验证和跳转 HTTPS。
# 跳转必须用 308 而不是 301/302：插件的授权接口是 POST，
# 浏览器和 fetch 跟随 301/302 时会把 POST 降级成 GET，服务端返回 405。
server {
    listen 80;
    listen [::]:80;
    server_name www.pubflow.chaoleme.cn;

    client_max_body_size 100m;

    # ACME HTTP-01 验证目录（证书续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
